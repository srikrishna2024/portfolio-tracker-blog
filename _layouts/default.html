<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | strip | truncate: 160 }}{% else %}{{ site.description }}{% endif %}">
  {% seo %}
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Merriweather:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a href="{{ '/' | relative_url }}" class="site-title">{{ site.title }}</a>
      <nav>
        <a href="{{ '/' | relative_url }}">Home</a>
        <a href="{{ '/blog/' | relative_url }}">Blog</a>
        <a href="{{ '/getting-started/' | relative_url }}">Getting Started</a>
        <a href="{{ '/faq/' | relative_url }}">FAQ</a>
        <a href="{{ '/system-requirements/' | relative_url }}">System Requirements</a>
        <a href="{{ '/get-the-app/' | relative_url }}" class="nav-cta">Purchase</a>
        <a href="{{ '/contact/' | relative_url }}">Contact</a>
      </nav>
    </div>
  </header>

  <main class="container">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>{{ site.title }} &mdash; {{ site.description }}</p>
      <p style="margin-top:8px;">Questions? <a href="{{ '/contact/' | relative_url }}">Get in touch</a></p>
      <p class="footer-links">
        <a href="{{ '/terms/' | relative_url }}">Terms and Conditions</a>
        <span class="footer-sep">·</span>
        <a href="{{ '/refund-policy/' | relative_url }}">Refund Policy</a>
        <span class="footer-sep">·</span>
        <a href="{{ '/system-requirements/' | relative_url }}">System Requirements</a>
        <span class="footer-sep">·</span>
        <a href="{{ '/getting-started/' | relative_url }}">Getting Started</a>
        <span class="footer-sep">·</span>
        <a href="{{ '/faq/' | relative_url }}">FAQ</a>
      </p>
    </div>
  </footer>
</body>
</html>
